<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Australian Citizenship Test</title>
  <script>
    // SPA redirect for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
    // Custom domain serves the site from the root — keep 0 path segments.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/?/' +
      l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
