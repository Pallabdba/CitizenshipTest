name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:static
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: https://gddcdfwhmxnenzdrkkac.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkZGNkZndobXhuZW56ZHJra2FjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NTM2ODMsImV4cCI6MjA5NDEyOTY4M30.dFYe-rBZBzjktZbbyX59OPOqgM4iQvSr1eZDrYVc5qo

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
